name: Build and Deploy

# Push to main -> build the image, render the deploy config, push to ECR.
# The ECR push fires an EventBridge rule, which starts CodePipeline, which runs
# a CodeDeploy blue/green deployment onto the ECS service.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# id-token: write is what makes OIDC possible. No AWS access keys are stored
# anywhere in this repository.
permissions:
  id-token: write
  contents: read

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'week6-todo' }}
  CONFIG_BUCKET: ${{ vars.CONFIG_BUCKET }}
  TASK_FAMILY: ${{ vars.TASK_FAMILY || 'week6-todo' }}
  CONTAINER_NAME: app

jobs:
  build-and-deploy:
    name: Build image and trigger blue/green deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast and legibly on bad configuration. Without this, a malformed
      # AWS_REGION surfaces much later as an opaque DNS error from the OIDC step
      # ("getaddrinfo ENOTFOUND sts.<region>.amazonaws.com"), which looks like a
      # network or permissions problem rather than a typo in a repo variable.
      - name: Verify required repository configuration
        run: |
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${CONFIG_BUCKET}" ] || fail \
            "CONFIG_BUCKET repository variable is not set. Set it to the ConfigBucketName stack output."

          [ -n "${ROLE_ARN}" ] || fail \
            "AWS_ROLE_ARN repository secret is not set. Set it to the GitHubActionsRoleArn stack output."

          # The value is masked in logs, so report only the shape, never the value.
          case "${ROLE_ARN}" in
            arn:aws:iam::*:role/*) ;;
            *) fail "AWS_ROLE_ARN is set but is not an IAM role ARN (expected arn:aws:iam::<account>:role/<name>)." ;;
          esac

          # AWS region: two or more lowercase letters, a region word, and a digit.
          # e.g. eu-central-1, us-east-1, ap-southeast-2
          if ! printf '%s' "${AWS_REGION}" | grep -Eq '^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$'; then
            echo "::error::AWS_REGION is '${AWS_REGION}', which is not a valid AWS region."
            echo "Fix the AWS_REGION repository variable under:"
            echo "  Settings > Secrets and variables > Actions > Variables"
            echo "A truncated value such as 'eu-central-' is the usual cause."
            echo "Deleting the variable falls back to the workflow default, eu-central-1."
            exit 1
          fi

          echo "Region=${AWS_REGION}  EcrRepo=${ECR_REPOSITORY}  TaskFamily=${TASK_FAMILY}  ConfigBucket=${CONFIG_BUCKET}"
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      # Set the repository variable DEBUG_OIDC=true to print the identity claims
      # GitHub is presenting. Use this when the OIDC step fails with
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" - the "sub"
      # claim printed here must match the role's trust policy condition.
      # Only the claims are printed, never the token itself.
      - name: Debug OIDC claims
        if: ${{ vars.DEBUG_OIDC == 'true' }}
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2)
          # base64url -> base64, then pad
          PAYLOAD=$(printf '%s' "$PAYLOAD" | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="${PAYLOAD}==";; 3) PAYLOAD="${PAYLOAD}=";; esac

          echo "Claims GitHub is presenting to AWS:"
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null > claims.json
          python3 <<'PY'
          import json
          c = json.load(open("claims.json"))
          keys = ("sub", "aud", "repository", "repository_owner",
                  "repository_owner_id", "repository_id", "ref")
          for k in keys:
              if k in c:
                  print("  %-20s = %s" % (k, c[k]))
          print()
          print("  The role's trust policy must accept the 'sub' value above.")
          PY
          rm -f claims.json
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${ECR_REPOSITORY}"
          docker build \
            --cache-from "type=gha" \
            --cache-to "type=gha,mode=max" \
            --load \
            -t "$IMAGE_URI:${GITHUB_SHA}" \
            -t "$IMAGE_URI:latest" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # Render taskdef.json from the LIVE task definition that CloudFormation
      # created, so IAM roles, env vars, secrets and log config always stay in
      # sync with the infrastructure stack. Nothing is duplicated by hand.
      - name: Render taskdef.json
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition' --output json > full-taskdef.json

          # Strip read-only fields that RegisterTaskDefinition rejects, plant the
          # <IMAGE1_NAME> placeholder CodeDeploy substitutes, and drop the
          # bootstrap command/entryPoint so the real image runs its own CMD.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | (.containerDefinitions[] | select(.name=="'"${CONTAINER_NAME}"'") | .image) = "<IMAGE1_NAME>"
              | (.containerDefinitions[] |= del(.command, .entryPoint))' \
            full-taskdef.json > taskdef.json

          echo "----- taskdef.json -----"
          cat taskdef.json

      - name: Package and upload config.zip (taskdef + appspec)
        run: |
          zip -j config.zip taskdef.json appspec.yaml
          aws s3 cp config.zip "s3://${CONFIG_BUCKET}/config/config.zip"

      # Pushed LAST, on purpose: the EventBridge rule watches the :latest tag,
      # so config.zip must already be in S3 when the pipeline starts.
      - name: Push image to ECR
        run: |
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${IMAGE_URI}:${GITHUB_SHA}\`"
            echo "- \`${IMAGE_URI}:latest\`"
            echo ""
            echo "EventBridge should now start CodePipeline, which runs the"
            echo "CodeDeploy blue/green deployment onto the ECS service."
          } >> "$GITHUB_STEP_SUMMARY"
