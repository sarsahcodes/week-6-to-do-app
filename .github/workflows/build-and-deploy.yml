name: Build and Deploy

# Push to main -> build the image and push it to ECR. That is the whole job.
#
# The ECR push fires an EventBridge rule, which starts CodePipeline, which runs
# a CodeDeploy blue/green deployment onto the ECS service. taskdef.json and
# appspec.yaml are NOT produced here: the infrastructure stack renders them into
# s3://<config-bucket>/config/config.zip at deploy time, so CI never reads the
# live task definition back out of AWS.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# id-token: write is what makes OIDC possible. No AWS access keys are stored
# anywhere in this repository.
permissions:
  id-token: write
  contents: read

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    name: Build image and trigger blue/green deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validates AWS_REGION / ECR_REPOSITORY / AWS_ROLE_ARN against the same
      # rules AWS enforces, and writes the values back cleaned of stray
      # whitespace, backticks and quotes. See the script for the full reasoning.
      - name: Verify required repository configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: bash .github/scripts/verify-config.sh

      # Set the repository variable DEBUG_OIDC=true to print the identity claims
      # GitHub is presenting. Use this when the next step fails with
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      - name: Debug OIDC claims
        if: ${{ vars.DEBUG_OIDC == 'true' }}
        run: python3 .github/scripts/debug-oidc-claims.py

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push in one step - nothing has to happen between them any more,
      # because config.zip is already in S3 before the first push.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${IMAGE_URI}:${GITHUB_SHA}\`"
            echo "- \`${IMAGE_URI}:latest\`"
            echo ""
            echo "EventBridge should now start CodePipeline, which runs the"
            echo "CodeDeploy blue/green deployment onto the ECS service."
          } >> "$GITHUB_STEP_SUMMARY"
